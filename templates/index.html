<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 420px; max-width: 100%; height: 650px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: linear-gradient(135deg, #003366, #0055a5); color: white; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 1.5rem; background: rgba(255, 255, 255, 0.2); padding: 10px; border-radius: 50%; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f8fafc; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.5; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: linear-gradient(135deg, #003366, #004080); color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background: #ffffff; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        
        .chat-input-area { display: flex; padding: 14px 18px; background: #ffffff; border-top: 1px solid #f1f5f9; gap: 8px; align-items: center; position: relative; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px 18px; border: 1.5px solid #e2e8f0; border-radius: 25px; outline: none; font-size: 0.95rem; }
        
        /* Upload Button Style */
        .file-label { cursor: pointer; color: #003366; font-size: 1.2rem; padding: 8px; transition: 0.2s; }
        .file-label:hover { color: #0055a5; }
        #fileInput { display: none; }
        
        .send-btn { background: linear-gradient(135deg, #003366, #0055a5); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1rem; }
        
        .file-preview { position: absolute; top: -35px; left: 20px; background: #003366; color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; display: none; align-items: center; gap: 6px; }
        .file-preview i { cursor: pointer; }
        
        .typing-indicator { display: flex; gap: 5px; padding: 12px 16px; background: #ffffff; border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; border: 1px solid #e2e8f0; }
        .typing-indicator span { width: 8px; height: 8px; background: #003366; border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <i class="fas fa-graduation-cap"></i>
        <div>
            <h2>Mentora</h2>
            <p style="font-size:0.75rem; opacity:0.8;">ISU-AI Chatbot</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
            Welcome! Feel free to ask any questions or upload documents and images for a comprehensive analysis.
        </div>
    </div>

    <div class="chat-input-area">
        <div class="file-preview" id="filePreview">
            <span id="fileName"></span>
            <i class="fas fa-times" onclick="clearFile()"></i>
        </div>

        <label for="fileInput" class="file-label" title="Attach file">
            <i class="fas fa-paperclip"></i>
        </label>
        <input type="file" id="fileInput" onchange="showFileName()">

        <input type="text" id="userInput" placeholder="Ask something..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    function showFileName() {
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');

        if (fileInput.files.length > 0) {
            fileName.innerText = fileInput.files[0].name;
            filePreview.style.display = 'flex';
        }
    }

    function clearFile() {
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        fileInput.value = '';
        filePreview.style.display = 'none';
    }

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const fileInput = document.getElementById('fileInput');
        const chatMessages = document.getElementById('chatMessages');
        
        const userText = inputField.value.trim();
        const file = fileInput.files[0];

        if (!userText && !file) return;

        let displayMsg = userText;
        if (file) {
            displayMsg = (userText ? userText + '<br>' : '') + `📎 <i>[Uploaded: ${file.name}]</i>`;
        }

        appendMessage(displayMsg, 'user-message', true);

        const formData = new FormData();
        if (userText) formData.append('message', userText);
        if (file) formData.append('file', file);

        inputField.value = '';
        clearFile();

        // Typing Indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'typing-indicator';
        loadingDiv.id = 'loading';
        loadingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            document.getElementById('loading')?.remove();

            if (data.response) {
                appendMessage(data.response, 'bot-message');
            } else {
                appendMessage('Error processing request.', 'bot-message');
            }
        } catch (error) {
            document.getElementById('loading')?.remove();
            appendMessage('Error connecting to backend.', 'bot-message');
        }
    }

    function appendMessage(text, className, isHTML = false) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        if (isHTML) {
            messageDiv.innerHTML = text;
        } else {
            messageDiv.innerText = text;
        }
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
